<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1729"/>
    </linearGradient>
    <radialGradient id="black-stone" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#000"/>
    </radialGradient>
    <radialGradient id="white-stone" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="70%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#c8c8c8"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#3a4a6b" stroke-width="2">
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="208" x2="416" y2="208"/>
    <line x1="96" y1="288" x2="416" y2="288"/>
    <line x1="96" y1="368" x2="416" y2="368"/>
    <line x1="128" y1="96" x2="128" y2="416"/>
    <line x1="208" y1="96" x2="208" y2="416"/>
    <line x1="288" y1="96" x2="288" y2="416"/>
    <line x1="368" y1="96" x2="368" y2="416"/>
  </g>
  
  <!-- Black stones -->
  <circle cx="208" cy="208" r="36" fill="url(#black-stone)"/>
  <circle cx="288" cy="288" r="36" fill="url(#black-stone)"/>
  <circle cx="208" cy="368" r="36" fill="url(#black-stone)"/>
  
  <!-- White stones -->
  <circle cx="288" cy="208" r="36" fill="url(#white-stone)"/>
  <circle cx="368" cy="288" r="36" fill="url(#white-stone)"/>
  
  <!-- Accent glow on one stone -->
  <circle cx="208" cy="288" r="40" fill="none" stroke="#00d9ff" stroke-width="3" opacity="0.8"/>
  <circle cx="208" cy="288" r="36" fill="url(#black-stone)"/>
</svg>

